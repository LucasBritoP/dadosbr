name: ci

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Public safety scan
        run: python scripts/scan_public_safety.py
      - name: Compile
        run: python -m compileall -q src
      - name: Pytest
        run: python -m pytest -q
      - name: OpenAPI smoke
        run: python scripts/export_openapi.py --check
      - name: Entrypoint imports
        run: python -c "from dadosbr.api.app import app; from dadosbr.cli.admin import parse_args; import dadosbr.mcp.server; assert app.title == 'DadosBR API'; assert parse_args(['cnpj','status']).action == 'status'"
      - name: Build package
        run: python -m build
