[project]
name = "dadosbr"
version = "0.1.0a0"
description = "API and MCP server for free Brazilian market data sources."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "DadosBR Contributors" }]
keywords = ["brazil", "market-data", "fastapi", "mcp", "finance", "dados-abertos"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "certifi>=2024.0.0",
  "mcp>=1.10.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "httpx>=0.27.0",
  "build>=1.2.0"
]
enriched = [
  "yfinance>=0.2.0"
]

[project.scripts]
dadosbr-api = "dadosbr.api.app:main"
dadosbr-mcp = "dadosbr.mcp.server:main"
dadosbr-admin = "dadosbr.cli.admin:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
  "live: tests that call external official sources and require DADOSBR_RUN_LIVE_TESTS=1"
]

[tool.ruff]
line-length = 100
target-version = "py311"
